<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Banner</title>
    <link rel="stylesheet" href="/src/css/css_output.css" />
  </head>
  <body class="bg-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-6xl mx-auto p-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Left Main Banner -->
        <div
          class="md:col-span-2 bg-white border border-gray-300 flex flex-col md:flex-row items-center p-6"
        >
          <div class="flex-shrink-0 w-full md:w-1/2 flex justify-center">
            <img
              src="images/bag.jpeg"
              alt="Bag"
              class="object-cover rounded-lg w-full h-64 md:h-80"
            />
          </div>
          <div
            class="flex flex-col justify-center items-center md:items-start w-full md:w-1/2 mt-6 md:mt-0 md:ml-8"
          >
            <h1 class="text-4xl md:text-5xl font-black italic mb-4 text-black">
              LOREM IPSUM
            </h1>
            <p
              class="text-lg md:text-xl text-black mb-8 text-center md:text-left"
            >
              Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed
            </p>
            <button
              class="bg-black text-white font-bold py-2 px-8 rounded hover:bg-gray-800 transition"
            >
              BUTTON
            </button>
          </div>
        </div>
        <!-- Right Side Cards -->
        <div class="flex flex-col gap-6">
          <!-- Card 1 -->
          <div class="bg-white border border-gray-300 flex items-center p-6">
            <img
              src="images/footware.jpeg"
              alt="Foot ware"
              class="w-16 h-16 object-contain mr-4"
            />
            <div>
              <p class="text-lg font-medium text-black">Lorem ipsum</p>
              <button
                class="mt-2 text-black font-bold tracking-wide hover:underline"
              >
                SHOP NOW
              </button>
            </div>
          </div>
          <!-- Card 2 -->
          <div class="bg-white border border-gray-300 flex items-center p-6">
            <img
              src="images/Screens.jpeg"
              alt="Screens"
              class="w-16 h-16 object-contain mr-4"
            />
            <div>
              <p class="text-lg font-medium text-black">Lorem ipsum</p>
              <button
                class="mt-2 text-black font-bold tracking-wide hover:underline"
              >
                SHOP NOW
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
